spring.application.name=baitapSession06
spring.config.import=optional:file:../.local-config/baitapSession06.properties,optional:file:./config/application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parking_management_session06}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
